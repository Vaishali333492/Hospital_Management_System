<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Health Care System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    .info {
      margin-top: 20px;
      font-size: 18px;
    }

    button {
      margin-top: 20px;
      padding: 10px;
      font-weight: bold;
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<h2>Welcome to the Health Care Dashboard</h2>
<p id="userDisplay"></p>
<div class="info" id="apiData"></div>
<button onclick="logout()">Logout</button>

<script>
window.onload = async function () {
  const token = localStorage.getItem('token');
  const username = localStorage.getItem('username');

  if (!token) {
    window.location.href = 'login.html';
    return;
  }

  document.getElementById('userDisplay').innerText = "Logged in as: " + username;

  try {
    const res = await fetch(`http://localhost:5001/api/patient/123`, {
      method: 'GET',
      headers: {
        'Authorization': 'Bearer ' + token
      }
    });

    const data = await res.json();
    document.getElementById('apiData').innerText = JSON.stringify(data, null, 2);
  } catch (error) {
    document.getElementById('apiData').innerText = 'Error fetching patient data';
  }
};

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('username');
  window.location.href = 'login.html';
}
</script>

</body>
</html>
